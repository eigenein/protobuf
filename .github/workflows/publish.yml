name: Publish

on:
  release:
    types: [published]

env:
  ANSICON: 1
  FORCE_COLOR: 1

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: "✨ Install Poetry"
      run: |
        pipx install poetry
        pipx inject poetry poetry-dynamic-versioning
    - name: 📦 Build package
      run: poetry build --ansi

    - name: 📤 Publish package
      run: poetry publish --ansi
      env:
        POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
